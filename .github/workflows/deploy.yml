name: Deploy MCP Edge Function to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Supabase Edge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Project Reference
        id: project_info
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$PROJECT_ID" ]; then
            REF="$PROJECT_ID"
          elif [ -n "$SUPABASE_URL" ]; then
            REF=$(echo "$SUPABASE_URL" | sed -E 's|https?://([^.]+)\.supabase\.co.*|\1|')
          else
            echo "::error::Neither SUPABASE_PROJECT_ID nor SUPABASE_URL is set in GitHub Secrets!"
            exit 1
          fi
          echo "PROJECT_REF=$REF" >> "$GITHUB_OUTPUT"
          echo "Using Supabase Project Reference: $REF"

      - name: Configure Optional Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.project_info.outputs.PROJECT_REF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Configuring GEMINI_API_KEY in Supabase..."
            supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --project-ref "$PROJECT_REF" --yes
          fi
          if [ -n "$GOOGLE_API_KEY" ]; then
            echo "Configuring GOOGLE_API_KEY in Supabase..."
            supabase secrets set GOOGLE_API_KEY="$GOOGLE_API_KEY" --project-ref "$PROJECT_REF" --yes
          fi
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "Configuring OPENAI_API_KEY in Supabase..."
            supabase secrets set OPENAI_API_KEY="$OPENAI_API_KEY" --project-ref "$PROJECT_REF" --yes
          fi

      - name: Push Database Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ steps.project_info.outputs.PROJECT_REF }}
        run: |
          echo "Checking for database migrations in supabase/migrations..."
          if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "Applying pending migrations to Supabase project $PROJECT_REF..."
            if [ -n "$SUPABASE_DB_PASSWORD" ]; then
              supabase db push --remote "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --include-all --yes
            else
              supabase migration up --remote "$PROJECT_REF" --include-all --yes || \
              supabase db push --remote "$PROJECT_REF" --include-all --yes || \
              echo "::warning::Automated migration push requires SUPABASE_DB_PASSWORD secret or an access token with database_write scope. If this step failed, run the migrations manually via Supabase Dashboard SQL Editor."
            fi
          else
            echo "No migration files found. Skipping."
          fi

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.project_info.outputs.PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing! Please generate a personal access token at https://supabase.com/dashboard/account/tokens and add it to GitHub Secrets."
            exit 1
          fi
          supabase functions deploy mcp --project-ref "$PROJECT_REF" --no-verify-jwt --yes

      - name: Display Function URL
        run: |
          REF="${{ steps.project_info.outputs.PROJECT_REF }}"
          echo "=========================================================="
          echo "✅ Edge Function successfully deployed!"
          echo "🔗 SSE URL: https://${REF}.supabase.co/functions/v1/mcp/sse"
          echo "=========================================================="
